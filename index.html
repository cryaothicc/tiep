<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TIEP</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&display=swap">
<style>
:root{
  --bg:#080603;--ph:#ffb000;--ph-dim:#cc8c00;--ph-faint:#1e1400;--err:#ff4d4d;--line:#2a1f08;--edge:#2e220a;
  --bezel:#1a1408;--bezel2:#120f05;--stand:#111008;
  --glow:0 0 4px rgba(255,176,0,.45),0 0 10px rgba(255,176,0,.18);color-scheme:dark
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--ph-dim);
  font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;letter-spacing:.02em;
  height:100%;overflow:hidden}

/* ── CRT overlays (inside screen only) ── */
.scan{position:absolute;inset:0;pointer-events:none;z-index:20;border-radius:6px;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.14) 2px 4px)}
.crt{position:absolute;inset:0;pointer-events:none;z-index:21;border-radius:6px;
  box-shadow:inset 0 0 80px rgba(0,0,0,.55),inset 0 0 3px rgba(255,176,0,.08)}

/* ════════════════════════════════
   DESK LAYOUT
   ════════════════════════════════ */
.desk{
  height:100vh;
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:0;padding:10px 16px 8px;
  overflow:hidden}

/* ── Monitor ── */
.monitor{
  width:min(960px,96vw);
  background:var(--bezel);
  border-radius:14px 14px 6px 6px;
  border:2px solid var(--edge);
  box-shadow:0 0 0 1px #120d04,0 8px 40px rgba(0,0,0,.8),0 0 60px rgba(255,176,0,.04);
  display:flex;flex-direction:column;
  flex:1;min-height:0}

/* monitor top bar */
.mon-top{
  height:28px;display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;border-bottom:1px solid var(--edge)}
.mon-dot{width:8px;height:8px;border-radius:50%;background:var(--edge);display:inline-block;margin-right:5px}
.mon-dot.lit{background:var(--ph);box-shadow:var(--glow)}
.mon-title{font-size:.62rem;color:var(--ph-dim);letter-spacing:.1em}
.mon-btn{background:none;border:0;color:var(--ph-dim);font:inherit;font-size:.65rem;cursor:pointer;
  padding:2px 6px;border-radius:3px;letter-spacing:.04em}
.mon-btn:hover{color:var(--ph)}
.mon-btn.on{color:var(--ph);border-bottom:1px solid var(--ph)}

/* screen glass */
.screen{
  position:relative;
  background:#0a0702;
  border-radius:4px;
  overflow:hidden;
  flex:1;min-height:0}

/* screen inner: panel left + main right */
.screen-inner{display:flex;height:100%}

/* ── Side panel ── */
#panel{
  width:220px;min-width:220px;flex-shrink:0;
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;
  overflow-y:auto;overflow-x:hidden;
  transition:width .25s,min-width .25s}
#panel.hide{width:0;min-width:0;border:none}
.pblock{border-bottom:1px solid var(--line);padding:9px 11px;overflow:hidden}
.plabel{font-size:.58rem;letter-spacing:.12em;color:var(--ph-dim);opacity:.55;margin-bottom:5px;text-transform:uppercase}
.regs{display:grid;grid-template-columns:1fr 1fr;gap:3px 8px}
.reg{font-size:.65rem;white-space:nowrap;overflow:hidden}
.reg .rk{color:var(--ph-dim);opacity:.65}
.reg .rv{color:var(--ph);text-shadow:var(--glow)}
.reg.flash .rv{color:#fff;text-shadow:0 0 8px #fff}
#minichart{width:100%;height:44px;display:block}
#accbars{display:flex;flex-direction:column;gap:3px;overflow:hidden}
.abar{display:flex;align-items:center;gap:5px;font-size:.6rem}
.abar .ak{width:9px;color:var(--ph-dim);flex-shrink:0}
.abar .atrack{flex:1;height:4px;background:var(--ph-faint);border-radius:2px;overflow:hidden}
.abar .afill{height:100%;background:var(--ph);border-radius:2px;transition:width .3s}
.abar .afill.bad{background:var(--err)}
.abar .apct{width:24px;text-align:right;color:var(--ph-dim);font-size:.56rem}
#log{height:calc(1.45em * 10);overflow:hidden;padding:7px 11px;display:flex;flex-direction:column;gap:2px}
.logline{font-size:.58rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:logfade .15s ease}
.logline .lt{color:var(--ph-dim);margin-right:3px;opacity:.7}
.logline .lm{color:var(--ph)}
.logline .lm.err{color:var(--err)}
.logline .lm.sys{color:var(--ph-dim)}
@keyframes logfade{from{opacity:0;transform:translateX(-3px)}}
.sigrow{display:flex;align-items:flex-end;gap:2px;height:18px}
.sig{width:4px;background:var(--ph-faint);border-radius:1px;transition:background .2s}
.sig.on{background:var(--ph)}
.sig.err{background:var(--err)}

/* ── Main typing area ── */
#main{flex:1;display:flex;flex-direction:column;padding:14px 18px 12px;gap:12px;min-width:0;overflow:auto}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
h1{font-size:1.2rem;font-weight:500;color:var(--ph);text-shadow:var(--glow);letter-spacing:.1em}
h1::after{content:"_";animation:blink 1.1s steps(2) infinite}
.bars{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.bar{display:flex;gap:1px;flex-wrap:wrap}
.bar button,.togbtn{background:none;border:0;color:var(--ph-dim);font:inherit;font-size:.72rem;
  padding:3px 6px;cursor:pointer;border-radius:3px;letter-spacing:.04em}
.bar button:hover,.togbtn:hover{color:var(--ph)}
.bar button.on,.togbtn.on{color:var(--ph);text-shadow:var(--glow);border-bottom:1px solid var(--ph)}
:focus-visible{outline:1px solid var(--ph);outline-offset:3px}
#live{font-size:1rem;color:var(--ph);text-shadow:var(--glow);height:1.4rem;visibility:hidden}
#live.run{visibility:visible}
#area{position:relative;overflow:hidden;user-select:none;cursor:text;font-size:1.35rem;line-height:2.2rem;
  height:6.6rem;color:var(--ph-dim);outline:none;display:flex;flex-wrap:wrap;align-content:flex-start;gap:0 .55ch}
#area.code{font-size:.95rem;line-height:1.6rem;height:8rem;display:block;white-space:pre}
#area.unfocused{filter:blur(5px);opacity:.5}
.l{color:var(--ph-dim)}
.l.ok{color:var(--ph);text-shadow:var(--glow)}
.l.no{color:var(--err)}
.l.ex{color:var(--err);opacity:.55}
.w{display:inline-block;position:relative}
.w.bad{border-bottom:2px solid var(--err)}
.w.blur{filter:blur(4px);opacity:.5}
.l.blur{filter:blur(3px);opacity:.4}
.code .h-kw{color:#ff66cc}.code .h-str{color:#ffd77a}
.code .h-com{color:#6a5628;font-style:italic}
.code .h-num{color:#fb923c}.code .h-pun{color:var(--ph-dim)}
.caret{position:absolute;width:.58ch;height:1.28em;background:var(--ph);box-shadow:var(--glow);
  animation:blink 1.1s steps(2) infinite;z-index:2}
.typing .caret{animation:none;opacity:.85}
.caret.bad{background:var(--err);box-shadow:0 0 6px rgba(255,77,77,.65)}
@keyframes blink{50%{opacity:0}}
#hint{text-align:center;font-size:.64rem;color:var(--ph-dim);margin:14px 0 0;opacity:.6}
kbd{font:inherit;color:var(--ph);border-bottom:1px solid var(--ph-dim)}
/* result */
#result{display:none;flex-direction:column;gap:18px}
#result.show{display:flex}
.stats{display:flex;gap:36px;flex-wrap:wrap;align-items:flex-end}
.n{color:var(--ph);text-shadow:var(--glow);line-height:1;font-weight:300}
.big .n{font-size:3rem}.sm .n{font-size:1.3rem}
.big .k,.sm .k{font-size:.68rem;margin-top:6px;color:var(--ph-dim)}
.meta{display:flex;gap:14px;font-size:.68rem;color:var(--ph-dim);flex-wrap:wrap}
#chart{width:100%;height:160px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
#result.go .stats>div{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
#result.go .stats>div:nth-child(2){animation-delay:.06s}
#result.go .stats>div:nth-child(3){animation-delay:.12s}
#result.go .stats>div:nth-child(4){animation-delay:.18s}
#result.go .stats>div:nth-child(5){animation-delay:.24s}
#result.go #chart{animation:rise .55s .2s cubic-bezier(.2,.7,.2,1) both}
#result.go .acts{animation:rise .45s .45s cubic-bezier(.2,.7,.2,1) both}
.acts{display:flex;gap:22px;flex-wrap:wrap}
#test{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding-bottom:5vh}
#test>*{width:min(100%,780px)}
#test.hide{display:none}
header,#hint{transition:opacity .3s}
#panel{transition:width .25s,min-width .25s,opacity .3s}
.screen-inner.focus header,.screen-inner.focus #hint{opacity:0;pointer-events:none}
.screen-inner.focus,.screen-inner.focus *{cursor:none}
.again{background:none;border:0;border-bottom:1px solid var(--ph-dim);color:var(--ph);font:inherit;
  font-size:.72rem;padding:3px 0;cursor:pointer}
.again:hover{border-color:var(--ph);text-shadow:var(--glow)}
.again kbd{border:0;color:var(--ph-dim);font-size:.62rem}
#weak{font-size:.68rem;color:var(--ph-dim);text-align:center;margin:10px 0 0}

/* monitor bottom */
.mon-bot{
  height:14px;background:var(--bezel2);border-top:1px solid var(--edge);
  border-radius:0 0 5px 5px;display:flex;align-items:center;justify-content:center}
.mon-led{width:5px;height:5px;border-radius:50%;background:var(--ph);box-shadow:var(--glow)}

/* ── Stand ── */
.stand-wrap{display:flex;flex-direction:column;align-items:center;width:min(960px,96vw)}
.stand-neck{width:50px;height:16px;background:var(--stand);border-left:1px solid var(--edge);border-right:1px solid var(--edge)}
.stand-foot{width:130px;height:7px;background:var(--stand);border-radius:0 0 6px 6px;
  border:1px solid var(--edge);border-top:none}

/* ════════════════════════════════
   KEYBOARD — outside the monitor
   ════════════════════════════════ */
.desk-kb{
  margin-top:10px;
  display:flex;flex-direction:column;align-items:center;gap:0}
.kbw{
  perspective:900px;
  width:max-content;max-width:96vw}
.kb{
  --k:min(30px,4.8vw);--g:min(4px,.8vw);
  transform:rotateX(28deg);transform-origin:50% 100%;
  display:flex;flex-direction:column;gap:var(--g)}
.kr{display:flex;gap:var(--g)}
.kr:nth-child(2){margin-left:calc(var(--k)*.4)}
.kr:nth-child(3){margin-left:calc(var(--k)*.7)}
.kr:nth-child(4){margin-left:calc(var(--k)*1.2)}
.key{
  width:var(--k);height:var(--k);border-radius:6px;
  border:1px solid var(--line);background:#0f0b04;
  box-shadow:0 4px 0 #080602,0 0 0 1px #0a0703;
  display:grid;place-items:center;font-size:.66rem;color:var(--ph-dim);
  transition:transform .07s,background .2s,color .2s,border-color .2s}
.key.sp{width:calc(var(--k)*6.2);margin:0 auto}
.key.dn{
  transform:translateY(4px);
  box-shadow:0 0 0 #080602;
  background:var(--ph);color:#000;border-color:var(--ph);
  transition:transform .03s,background 0s}
/* keyboard base/plate */
.kb-plate{
  background:#0e0a03;border:1px solid var(--line);border-top:none;
  border-radius:0 0 8px 8px;height:6px;width:calc(var(--k)*10.5 + var(--g)*9 + 2px)}

@media (prefers-reduced-motion:reduce){
  .caret,h1::after{animation:none}.key{transition:none}
  #result.go *,.afill{animation:none!important;transition:none!important}}
@media (max-width:700px){
  #panel{display:none}
  .kb{--k:min(30px,7.5vw)}}
</style>
</head>
<body>
<div class="desk">

  <!-- ══ MONITOR ══ -->
  <div class="monitor">

    <!-- top bezel bar -->
    <div class="mon-top">
      <div>
        <span class="mon-dot"></span>
        <span class="mon-dot"></span>
        <span class="mon-dot lit"></span>
      </div>
      <span class="mon-title">TIEP v2</span>
      <div class="bars" style="gap:3px">
        <button class="mon-btn on" id="panelbtn">&#x2630;</button>
        <div class="bar"><button id="snd" class="on" aria-pressed="true">snd:on</button></div>
      </div>
    </div>

    <!-- screen -->
    <div class="screen">
      <div class="scan"></div><div class="crt"></div>
      <div class="screen-inner">

        <!-- side panel -->
        <aside id="panel">
          <div class="pblock">
            <div class="plabel">registers</div>
            <div class="regs">
              <div class="reg" id="rg-mode"><span class="rk">MODE </span><span class="rv" id="rv-mode">words</span></div>
              <div class="reg" id="rg-var"><span class="rk">VAR  </span><span class="rv" id="rv-var">normal</span></div>
              <div class="reg" id="rg-wi"><span class="rk">WI   </span><span class="rv" id="rv-wi">0x0000</span></div>
              <div class="reg" id="rg-wpm"><span class="rk">WPM  </span><span class="rv" id="rv-wpm">--</span></div>
              <div class="reg" id="rg-acc"><span class="rk">ACC  </span><span class="rv" id="rv-acc">--%</span></div>
              <div class="reg" id="rg-buf"><span class="rk">BUF  </span><span class="rv" id="rv-buf">""</span></div>
              <div class="reg" id="rg-exp"><span class="rk">EXP  </span><span class="rv" id="rv-exp">'?'</span></div>
              <div class="reg" id="rg-err"><span class="rk">ERR  </span><span class="rv" id="rv-err">0</span></div>
              <div class="reg" id="rg-t"><span class="rk">TIME </span><span class="rv" id="rv-t">--</span></div>
              <div class="reg" id="rg-st"><span class="rk">STATE</span><span class="rv" id="rv-st">IDLE</span></div>
            </div>
          </div>
          <div class="pblock">
            <div class="plabel">wpm</div>
            <canvas id="minichart"></canvas>
            <div style="display:flex;gap:8px;margin-top:5px">
              <div><div class="plabel" style="margin:0">wpm</div><div class="sigrow" id="sig-wpm"></div></div>
              <div><div class="plabel" style="margin:0">acc</div><div class="sigrow" id="sig-acc"></div></div>
            </div>
          </div>
          <div class="pblock">
            <div class="plabel">key accuracy</div>
            <div id="accbars"></div>
          </div>
          <div class="pblock" style="flex:1;display:flex;flex-direction:column">
            <div class="plabel">event log</div>
            <div id="log"></div>
          </div>
        </aside>

        <!-- main -->
        <div id="main">
          <header>
            <h1>tiep</h1>
            <div class="bars">
              <div class="bar" id="content" role="group"><button data-c="words" class="on">words</button><button data-c="code">code</button></div>
              <div class="bar" id="lang" role="group" style="display:none"><button data-l="js" class="on">js</button><button data-l="py">py</button></div>
              <div class="bar" id="len" role="group"><button data-t="15">15</button><button data-t="30" class="on">30</button><button data-t="60">60</button></div>
              <div class="bar" id="var" role="group"><button data-v="normal" class="on">normal</button><button data-v="blind">blind</button><button data-v="lock">lock</button></div>
            </div>
          </header>

          <section id="test">
            <div id="live" aria-live="off">30</div>
            <div id="area" tabindex="0" role="textbox" aria-label="Typing area"></div>
            <p id="hint">click and type &middot; <kbd>tab</kbd>+<kbd>enter</kbd> new &middot; <kbd>tab</kbd>+<kbd>r</kbd> repeat</p>
          </section>

          <section id="result" aria-live="polite">
            <div class="stats">
              <div class="big"><div class="n" id="rWpm">0</div><div class="k">wpm</div></div>
              <div class="big"><div class="n" id="rAcc">0%</div><div class="k">accuracy</div></div>
              <div class="sm"><div class="n" id="rRaw">0</div><div class="k">raw</div></div>
              <div class="sm"><div class="n" id="rChars">0</div><div class="k">c/w/e</div></div>
              <div class="sm"><div class="n" id="rTime">0s</div><div class="k">time</div></div>
            </div>
            <div class="meta"><span id="rMode"></span><span id="rBest"></span></div>
            <canvas id="chart"></canvas>
            <p id="weak"></p>
            <div class="acts">
              <button class="again" id="next">next <kbd>tab+enter</kbd></button>
              <button class="again" id="rep">repeat <kbd>tab+r</kbd></button>
              <button class="again" id="drill" style="display:none">drill weak keys</button>
            </div>
          </section>
        </div>

      </div><!-- /screen-inner -->
    </div><!-- /screen -->

    <div class="mon-bot"><div class="mon-led"></div></div>
  </div><!-- /monitor -->

  <!-- ══ STAND ══ -->
  <div class="stand-wrap">
    <div class="stand-neck"></div>
    <div class="stand-foot"></div>
  </div>

  <!-- ══ KEYBOARD (outside monitor) ══ -->
  <div class="desk-kb">
    <div class="kbw" aria-hidden="true"><div class="kb" id="kb"></div></div>
    <div class="kb-plate" id="kb-plate"></div>
  </div>

</div><!-- /desk -->

<script>
const WORDS="the be of and a to in he have it that for they with as not on she at by this we you do but from or which one would all will there say who make when can more if no man out other so what time up go about than into could state only new year some take come these know see use get like then first any work now may such give over think most even find day also after way many must look before great back through long where much should well people down own just because good each those feel seem how high too place little world very still nation hand old life tell write become here show house both between need mean call develop under last right move thing general school never same another begin while number part turn real leave might want point form off child few small since against ask late home interest large person end open public follow during present without again hold govern around possible head consider word program problem however lead system set order eye plan run keep face fact group play stand increase early course change help line".split(" ");
const CODE={
js:[`function add(a, b) {\n  return a + b;\n}`,`const arr = [1, 2, 3];\narr.map(x => x * 2);`,`for (let i = 0; i < 10; i++) {\n  console.log(i);\n}`,`const user = {\n  name: "Ada",\n  age: 30\n};`,`if (x > 0 && y < 0) {\n  return true;\n}`,`const greet = (name) => {\n  return "hi " + name;\n};`,`while (n > 0) {\n  n = n - 1;\n  total += n;\n}`,`const sq = x => x * x;\nsq(5);`],
py:[`def add(a, b):\n    return a + b`,`nums = [1, 2, 3]\nfor n in nums:\n    print(n)`,`def greet(name):\n    return f"hi {name}"`,`if x > 0 and y < 0:\n    return True`,`data = {"name": "Ada", "age": 30}`,`for i in range(10):\n    print(i)`,`while n > 0:\n    n = n - 1\n    total += n`,`def sq(x):\n    return x * x`]
};
const $=id=>document.getElementById(id);
const area=$("area"),live=$("live");
let mode="words",variant="normal",len=30,lang="js";
let list=[],typed=[],wi=0,text="",typedCode="",codeSpans=[],hl=[],caret;
let started=false,start=0,timer=null,done=false,samples=[],keyTotal=0,errTotal=0;
let armed=false,armT,drillNext=false;
let keyStats=load("tiep_keys",{}),runs=load("tiep_runs",[]);
let sound=true;
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function recordKey(c,ok){keyTotal++;if(!ok)errTotal++;if(c&&c.length===1){const s=keyStats[c]||(keyStats[c]={t:0,e:0});s.t++;if(!ok)s.e++}}
function weakKeys(){const a=[];for(const c in keyStats){if(/[a-z]/.test(c)){const s=keyStats[c];if(s.t>=5)a.push({c,r:s.e/s.t,t:s.t})}}a.sort((x,y)=>y.r-x.r||y.t-x.t);return a.slice(0,7).map(x=>x.c)}
function genWords(n){const a=[];for(let i=0;i<n;i++){let w;do{w=WORDS[Math.random()*WORDS.length|0]}while(a.length&&w===a[a.length-1]);a.push(w)}return a}
function genCode(){return CODE[lang][Math.random()*CODE[lang].length|0]}
function genDrill(){const wk=weakKeys();if(!wk.length)return genWords(200);const cands=WORDS.filter(w=>wk.some(k=>w.includes(k)));const pool=cands.length?cands:WORDS;const a=[];for(let i=0;i<200;i++){let w;do{w=pool[Math.random()*pool.length|0]}while(a.length&&w===a[a.length-1]);a.push(w)}return a}
function tokenize(code,lg){
  const kw=lg==="py"?new Set("def return if else elif for while in and or not True False None print range import from class is lambda with as try except".split(" ")):new Set("const let var function return if else for while do switch case break continue new class extends this typeof instanceof in of true false null undefined console log map filter reduce async await import export default try catch".split(" "));
  const out=[];const push=(s,c)=>{for(const ch of s)out.push({ch,c})};
  let i=0,n=code.length;const idS=c=>/[A-Za-z_$]/.test(c),id=c=>/[A-Za-z0-9_$]/.test(c);
  while(i<n){const c=code[i];
    if(lg==="py"&&c==="#"){let j=i;while(j<n&&code[j]!=="\n")j++;push(code.slice(i,j),"com");i=j;continue}
    if(lg==="js"&&c==="/"&&code[i+1]==="/"){let j=i;while(j<n&&code[j]!=="\n")j++;push(code.slice(i,j),"com");i=j;continue}
